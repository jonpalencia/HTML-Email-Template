<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern HTML Email Template</title>
    <style type="text/css">
      /*     Reset style tags     */
      /* 1. Prevent default underline & color overrides across modern clients */
      a {
        text-decoration: none !important;
        font-family: Arial, sans-serif; /* Replace with your email font */
      }

      /* 2. Fix Gmail's habit of un-styling links back to default blue */
      u + .body a {
        color: inherit !important;
        text-decoration: none !important;
        font-size: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
      }

      /* 3. Force Outlook to properly space elements inside webmail layouts */
      #outlook a {
        padding: 0;
      }

      /* 4. Reset images inside links (removes default blue borders) */
      img,
      a img {
        border: 0 !important;
        outline: none;
        text-decoration: none;
      }

      /*     END RESET STYLE    */
      body {
        margin: 0;
        background-color: #cccccc;
      }
      table {
        border-spacing: 0;
      }
      td {
        padding: 0;
      }
      img {
        border: 0;
      }
      .wrapper {
        background-color: #ffffff;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        border-spacing: 0;
        border: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #171a1b;
      }
      .two-columns {
        width: 100%;
        max-width: 600px;
        text-align: center;
        vertical-align: middle;
        font-size: 0px;
      }
      .two-columns .column {
        display: inline;
        width: 100%;
        max-width: 300px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <table class="wrapper" border="0" cellpadding="0" cellspacing="0" width="100%" align="center">
      <!-- TOP BORDER -->
      <tr>
        <td width="100%" height="8" style="background-color: #171a1b"></td>
      </tr>

      <!-- LOGO SECTION -->
      <tr>
        <td style="padding: 14px 0px 4px">
          <table border="0" cellpadding="0" cellspacing="0" width="100%" align="center">
            <tr>
              <td class="two-columns">
                <table class="column">
                  <tr>
                    <td style="padding: 0px 62px">
                      <a href="https://www.google.com" target="_blank">
                        <img src="./img/modern.jpg" alt="MODERN LOGO" title="Modern Logo" width="180" />
                      </a>
                    </td>
                  </tr>
                </table>

                <table class="column">
                  <tr>
                    <td style="padding: 10px 72px">
                      <a href="https://www.facebook.com" target="_blank">
                        <img class="header-logo logo" src="./img/black-facebook.png" alt="" width="30" />
                      </a>
                      <a href="https://www.x.com" target="_blank">
                        <img class="header-logo logo" src="./img/black-twitter.png" alt="" width="30" />
                      </a>
                      <a href="https://www.youtube.com" target="_blank">
                        <img class="header-logo logo" src="./img/black-youtube.png" alt="" width="30" />
                      </a>
                      <a href="https://www.linkedin.com" target="_blank">
                        <img class="header-logo logo" src="./img/black-linkedin.png" alt="" width="30" />
                      </a>
                      <a href="https://www.instagram.com" target="_blank">
                        <img class="header-logo logo" src="./img/black-instagram.png" alt="" width="30" />
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <!-- BANNER IMAGE -->
      <tr>
        <td class="banner-image" border="0" cellpadding="0" cellspacing="0">
          <a href="#" target="_blank" style="color: #171a1b">
            <img src="./img/banner.jpg" width="100%" style="max-width: 600px" alt="Banner Image" title="Banner Image" />
          </a>
        </td>
      </tr>

      <!-- THREE COLUMN SECTION -->

      <!-- TWO COLUMN SECTION -->

      <!-- TITLE, TEXT & BUTTON -->

      <!-- FOOTER SECTION -->
    </table>
  </body>
</html>
